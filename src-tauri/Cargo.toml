[package]
name = "devi-network"
version = "1.0.0"
description = "Devi Network Desktop Shell"
authors = ["Antigravity"]
edition = "2021"
rust-version = "1.60"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "1.5", features = ["api-all", "sqlite", "system-tray", "devtools"] }

[features]
# by default taure uses Webkit on macOS and WebView2 on Windows
default = [ "custom-protocol" ]
custom-protocol = [ "tauri/custom-protocol" ]
